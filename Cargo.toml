[package]
name = "jin10x"
version = "0.1.2"
edition = "2021"
rust-version = "1.71"
description = "金十数据源事实层：信封与数据类别类型化、离线解析、fail-closed 授权判定与跨域守卫"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/jin10x"
homepage = "https://github.com/bytechainx/jin10x"
documentation = "https://github.com/bytechainx/jin10x#readme"
readme = "README.md"
keywords = ["jin10", "macro", "envelope", "offline-parse", "source-facts"]
categories = ["data-structures", "parsing"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[package.metadata.bytechainx]
module_id = "jin10x"
owner = "bytechainx"
role = "data_source"
production_decision = "NO-GO"
semantic_contract = "docs/标准.md"
